# Local / single-host stack: PostgreSQL, Redis, API, Celery worker, web (nginx).
#   cp .env.compose.example .env.compose   # then set the REQUIRED values
#   docker compose --env-file .env.compose up --build
#   docker compose --env-file .env.compose --profile observability up   # adds Prometheus + Grafana
# Not run in the repository's verification (Docker was not available); see docs/deployment.md.

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://threatiq:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/threatiq
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (32+ random characters)}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
  NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
  NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
  NEBIUS_MODEL: ${NEBIUS_MODEL:-}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  NVD_API_KEY: ${NVD_API_KEY:-}
  VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  ALLOW_DEMO_DATA: ${ALLOW_DEMO_DATA:-false}
  SENTRY_DSN: ${SENTRY_DSN:-}
  ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
  ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
  ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
  ENTRA_DEFAULT_ROLE: ${ENTRA_DEFAULT_ROLE:-viewer}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threatiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: threatiq
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatiq -d threatiq"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # disposable data only; never the source of truth
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 40s

  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 40s

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:

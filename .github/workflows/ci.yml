name: ci

# Lint, type-check, build and package. This workflow intentionally runs NO automated tests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check app --select E9,F63,F7,F82,F401,F811
      - name: Byte-compile (syntax check)
        run: python -m compileall -q app alembic
      - name: Import the application (configuration and wiring)
        run: python -c "import app.main"
        env: { DATABASE_URL: "sqlite:///./ci.db" }
      - name: Migrations apply cleanly and match the models (static consistency check, not a test)
        run: |
          alembic upgrade head
          alembic check
        env: { DATABASE_URL: "sqlite:///./ci.db" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist, retention-days: 7 }

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - name: Validate (static)
        run: terraform validate

  package:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API/worker image (not pushed)
        uses: docker/build-push-action@v6
        with: { context: backend, push: false, tags: "threatiq-api:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - name: Build the web image (not pushed)
        uses: docker/build-push-action@v6
        with: { context: frontend, push: false, tags: "threatiq-web:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      # To publish, add a registry login and set push: true with an immutable tag (for example the git SHA).
